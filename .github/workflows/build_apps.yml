name: Build Morphe + De-ReVanced Apps (32 apps)

on:
  schedule:
    - cron: "0 6 */2 * *"   # Every 2 days at 06:00 UTC
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (or 'all' for auto-detection)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - youtube
          - music
          - reddit
          - tiktok
          - tiktok_jp
          - twitch
          - facebook
          - threads
          - soundcloud
          - google_news
          - proton_mail
          - viber
          - pixiv
          - cricbuzz
          - icon_studio
          - twitter
          - instagram
          - adguard
          - prime_video
          - duolingo
          - myfitnesspal
          - nova_launcher
          - solid_explorer
          - xodo_pdf
          - ibis_paint
          - wps_office
          - camscanner
          - fotmob
          - podcast_addict
          - proton_vpn
          - windy
          - sofascore
      version_override:
        description: "Force a specific version (e.g. 19.16.39) — leave empty for latest supported"
        required: false
        default: ""
      arch:
        description: "Target architecture"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Detect which apps need a build
  # ─────────────────────────────────────────────────────────────
  check-versions:
    name: "Check for new supported versions"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      any_needs_build:  ${{ steps.check.outputs.any_needs_build }}
      apps_to_build:    ${{ steps.check.outputs.apps_to_build }}
      morphe_tag:       ${{ steps.check.outputs.morphe_tag }}
      de_revanced_tag:  ${{ steps.check.outputs.de_revanced_tag }}
      piko_tag:         ${{ steps.check.outputs.piko_tag }}
      hoodles_tag:      ${{ steps.check.outputs.hoodles_tag }}
      cli_tag:          ${{ steps.check.outputs.cli_tag }}
      morphe_mpp:       ${{ steps.check.outputs.morphe_mpp }}
      de_revanced_mpp:  ${{ steps.check.outputs.de_revanced_mpp }}
      piko_mpp:         ${{ steps.check.outputs.piko_mpp }}
      hoodles_mpp:      ${{ steps.check.outputs.hoodles_mpp }}
      cli_jar:          ${{ steps.check.outputs.cli_jar }}
      target_arch:      ${{ steps.check.outputs.target_arch }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - uses: actions/setup-java@v4
        with: { distribution: "zulu", java-version: "17" }

      - name: Install dependencies
        run: pip install -q requests beautifulsoup4

      - name: Run version check
        id: check
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          SKIP_CLEANUP:     "true"
          MANUAL_APP:       ${{ github.event.inputs.app || 'all' }}
          MANUAL_VERSION:   ${{ github.event.inputs.version_override || '' }}
          TARGET_ARCH:      ${{ github.event.inputs.arch || 'arm64-v8a' }}
        run: python scripts/check_updates.py

      - name: Apps queued for build
        run: |
          echo '${{ steps.check.outputs.apps_to_build }}' \
            | python3 -c "
          import json, sys
          apps = json.load(sys.stdin)
          if apps:
              for a in apps:
                  print(f\"  {a['key']:20} {a['version']}\")
          else:
              print('  Nothing changed.')
          "

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build changed apps and publish release
  # ─────────────────────────────────────────────────────────────
  build-and-release:
    name: "Build & Release"
    needs: check-versions
    if: needs.check-versions.outputs.any_needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - uses: actions/setup-java@v4
        with: { distribution: "zulu", java-version: "17" }

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 'curl_cffi>=0.7'
          sudo apt-get install -y -q aapt apksigner

      - name: Install apkeep (APKPure downloader)
        run: |
          wget -qO apkeep \
            https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/

      - name: Download CLI & all patch bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_CLEANUP: "true"
          MANUAL_APP:   ${{ github.event.inputs.app || 'all' }}
          MANUAL_VERSION: ${{ github.event.inputs.version_override || '' }}
          TARGET_ARCH:  ${{ github.event.inputs.arch || 'arm64-v8a' }}
        run: python scripts/check_updates.py

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > morphe.keystore

      - name: Set build date
        id: date
        run: echo "today=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Build all queued apps
        env:
          APPS_JSON:        ${{ needs.check-versions.outputs.apps_to_build }}
          CLI_JAR:          ${{ needs.check-versions.outputs.cli_jar }}
          MORPHE_MPP:       ${{ needs.check-versions.outputs.morphe_mpp }}
          DE_REVANCED_MPP:  ${{ needs.check-versions.outputs.de_revanced_mpp }}
          PIKO_MPP:         ${{ needs.check-versions.outputs.piko_mpp }}
          HOODLES_MPP:      ${{ needs.check-versions.outputs.hoodles_mpp }}
          TARGET_ARCH:      ${{ needs.check-versions.outputs.target_arch }}
          TODAY:            ${{ steps.date.outputs.today }}
        run: |
          mkdir -p dist

          CLI=$(find . -maxdepth 1 -name "$CLI_JAR"        | head -1)
          MMPP=$(find . -maxdepth 1 -name "$MORPHE_MPP"     | head -1)
          DMPP=$(find . -maxdepth 1 -name "$DE_REVANCED_MPP" | head -1)
          PMPP=$(find . -maxdepth 1 -name "$PIKO_MPP"       | head -1)
          HMPP=$(find . -maxdepth 1 -name "$HOODLES_MPP"    | head -1)

          echo "$APPS_JSON" | python3 -c "
          import json, sys
          for a in json.load(sys.stdin):
              print(a['key'], a['package'], a['version'])
          " | while read KEY PKG VER; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ▶ $KEY  v$VER  [arch: ${TARGET_ARCH}]"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            APK_FILE=""
            for SRC in apk-pure; do
              echo "  Trying $SRC for ${PKG}@${VER}..."
              rm -f "${PKG}"*.apk "${PKG}"*.xapk 2>/dev/null || true
              apkeep -a "${PKG}@${VER}" -d "$SRC" . 2>&1 || true
              CANDIDATE=$(find . -maxdepth 1 \( -name "${PKG}*.apk" -o -name "${PKG}*.xapk" \) | head -1)
              if [ -n "$CANDIDATE" ] && [ -s "$CANDIDATE" ]; then
                APK_FILE="$CANDIDATE"
                echo "  Downloaded from $SRC: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"
                break
              fi
              echo "  $SRC produced no file for ${PKG}@${VER}"
            done

            if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
              echo "  Trying Uptodown scraper..."
              UPTODOWN_OUT="${PKG}.apk"
              if python scripts/uptodown_dl.py \
                  --name "$KEY" \
                  --package "$PKG" \
                  --version "$VER" \
                  --output "$UPTODOWN_OUT" 2>&1; then
                if [ -s "$UPTODOWN_OUT" ]; then
                  APK_FILE="$UPTODOWN_OUT"
                  echo "  Downloaded from Uptodown: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"
                fi
              fi
            fi

            if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
              echo "  No source found for $KEY v${VER} — skipping"
              continue
            fi

            echo "  Verifying APK signature..."
            if apksigner verify "$APK_FILE" 2>/dev/null; then
              echo "  Original signature OK"
            else
              echo "  Original signature mismatch (mirror repackaging) — will re-sign after patch"
            fi

            DETECTED_ARCH=$(aapt dump badging "$APK_FILE" 2>/dev/null \
              | grep "native-code" \
              | grep -oP "'\K[^']+" \
              | head -1 || echo "universal")
            ARCH_LABEL=${DETECTED_ARCH:-universal}
            echo "  Detected arch: $ARCH_LABEL"

            OUT="dist/${KEY}-morphe-v${VER}-${ARCH_LABEL}-${TODAY}.apk"
            echo "  Patching -> $OUT"
            if java -jar "$CLI" patch \
                --continue-on-error \
                --keystore=morphe.keystore \
                -p "$MMPP" \
                -p "$DMPP" \
                -p "$PMPP" \
                -p "$HMPP" \
                -o "$OUT" \
                "$APK_FILE"; then
              echo "  Built: $OUT"
            else
              echo "  Patch failed for $KEY"
              rm -f "$OUT"
            fi

            rm -f "$APK_FILE"
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Built APKs:"
          ls -lh dist/*.apk 2>/dev/null || echo "  None built."

      - name: Fail loudly if zero APKs produced
        env:
          APPS_JSON: ${{ needs.check-versions.outputs.apps_to_build }}
        run: |
          BUILT=$(ls dist/*.apk 2>/dev/null | wc -l)
          EXPECTED=$(echo "$APPS_JSON" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "Expected: $EXPECTED apps  |  Built: $BUILT APKs"
          if [ "$BUILT" = "0" ] && [ "$EXPECTED" != "0" ]; then
            echo "::error::Build silently failed — $EXPECTED apps queued, 0 APKs produced."
            exit 1
          fi

      - name: Carry over unchanged APKs from previous release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPS_JSON:    ${{ needs.check-versions.outputs.apps_to_build }}
        run: |
          PREV_TAG=$(gh release list --json tagName,isDraft \
            -q '.[] | select(.isDraft == false) | .tagName' \
            | grep "^morphe-apps-v[0-9]" | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release found — nothing to carry over."
            exit 0
          fi
          echo "Carrying over from: $PREV_TAG"

          BUILT_KEYS=$(echo "$APPS_JSON" | python3 -c "
          import json, sys
          apps = json.load(sys.stdin)
          print('\n'.join(a['key'].replace('_','-') for a in apps))
          ")

          gh release view "$PREV_TAG" --json assets -q '.assets[].name' | while read fname; do
            [[ "$fname" == "SHA256SUMS.txt" ]] && continue
            [[ "$fname" == *.apk ]] || continue
            KEY=$(echo "$fname" | sed 's/-morphe-.*//')
            if echo "$BUILT_KEYS" | grep -qx "$KEY"; then
              echo "  ⏭  $fname (newly built — skip)"
            elif [ -f "dist/$fname" ]; then
              echo "  ✅ $fname (already in dist)"
            else
              echo "  ↩  Carrying over: $fname"
              gh release download "$PREV_TAG" -p "$fname" -D dist/ 2>/dev/null \
                || echo "  ⚠️  Failed to carry over $fname"
            fi
          done

          echo ""
          echo "dist/ after carry-over ($(ls dist/*.apk 2>/dev/null | wc -l) APKs total):"
          ls dist/*.apk 2>/dev/null | sed 's|dist/||'

      - name: Generate SHA256 checksums
        run: |
          if ls dist/*.apk 1>/dev/null 2>&1; then
            cd dist && sha256sum *.apk > SHA256SUMS.txt
            echo "SHA256 checksums:"; cat SHA256SUMS.txt
          else
            echo "No APKs to checksum."
          fi

      - name: Upload artifact (90-day backup)
        uses: actions/upload-artifact@v4
        with:
          name: "morphe-apps-${{ steps.date.outputs.today }}"
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Build release notes
        env:
          APPS_JSON:    ${{ needs.check-versions.outputs.apps_to_build }}
          MORPHE_TAG:   ${{ needs.check-versions.outputs.morphe_tag }}
          DRVR_TAG:     ${{ needs.check-versions.outputs.de_revanced_tag }}
          PIKO_TAG:     ${{ needs.check-versions.outputs.piko_tag }}
          HOODLES_TAG:  ${{ needs.check-versions.outputs.hoodles_tag }}
          CLI_TAG:      ${{ needs.check-versions.outputs.cli_tag }}
          TODAY:        ${{ steps.date.outputs.today }}
          TRIGGER:      ${{ github.event_name }}
          MANUAL_APP:   ${{ github.event.inputs.app || 'all' }}
        run: |
          python3 - <<'PYEOF'
          import os, json, glob

          apps    = json.loads(os.environ["APPS_JSON"])
          morphe  = os.environ["MORPHE_TAG"]
          drvr    = os.environ["DRVR_TAG"]
          piko    = os.environ["PIKO_TAG"]
          hoodles = os.environ["HOODLES_TAG"]
          cli     = os.environ["CLI_TAG"]
          today   = os.environ["TODAY"]
          trigger = os.environ["TRIGGER"]
          manual  = os.environ.get("MANUAL_APP", "all")

          import re
          trigger_line = "Scheduled auto-build" if trigger == "schedule" else f"Manual build ({manual})"
          built_keys = {a["key"].replace("_", "-") for a in apps}
          pat = re.compile(
            r"^(.+?)-morphe-v(.+?)-(arm64-v8a|armeabi-v7a|universal|x86_64|x86)-\d{4}\.\d{2}\.\d{2}\.apk$"
          )

          rows = []
          for apk in sorted(glob.glob("dist/*.apk")):
            fname = os.path.basename(apk)
            m = pat.match(fname)
            if not m:
              continue
            key_h, version, arch = m.group(1), m.group(2), m.group(3)
            marker = "🆕" if key_h in built_keys else "↩"
            rows.append((key_h, version, arch, marker))

          lines = [
            "## Morphe + De-ReVanced Apps",
            "",
            trigger_line,
            "🆕 = newly built this run · ↩ = carried over (no change)",
            "",
            "| App | Version | Arch | |",
            "|-----|---------|------|--|",
          ]

          for key_h, version, arch, marker in rows:
            lines.append(f"| {key_h} | `{version}` | `{arch}` | {marker} |")

          lines += [
            "",
            f"**Morphe:** `{morphe}` · **De-ReVanced:** `{drvr}` · **Piko:** `{piko}` · **hoo-dles:** `{hoodles}` · **CLI:** `{cli}`",
            f"**Build date:** `{today}`",
            "",
            "---",
            "### Install notes",
            "- YouTube / YouTube Music: install [ReVanced GmsCore](https://github.com/ReVanced/GmsCore/releases/latest) first",
            "- All other apps: standalone install, no extra app needed",
            "",
            "### Verify downloads",
            "```",
            "sha256sum -c SHA256SUMS.txt",
            "```",
          ]

          with open("release_body.md", "w") as f:
            f.write("\n".join(lines))
          PYEOF

      - name: Delete previous auto-build releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName -q ".[].tagName" \
            | grep -E "^(morphe|revanced)-apps-v" \
            | while read -r tag; do
                gh release delete "$tag" -y --cleanup-tag || true
              done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "morphe-apps-v${{ steps.date.outputs.today }}${{ github.event_name == 'workflow_dispatch' && format('-manual-{0}', github.event.inputs.app) || '' }}"
          name: "Morphe Apps — ${{ steps.date.outputs.today }}${{ github.event_name == 'workflow_dispatch' && format(' (manual: {0})', github.event.inputs.app) || '' }}"
          body_path: release_body.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false
          draft: false
          prerelease: false

      - name: Save updated state
        if: github.event_name == 'schedule' || github.event.inputs.app == 'all'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update built versions state [skip ci]"
          branch: master
          file_pattern: ".github/last_built_versions.json"